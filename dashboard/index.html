<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSSQL MCP Gateway & Live Monitor — TG_2024</title>
  <meta name="description" content="Real-time Microsoft SQL Server database activity monitor powered by Model Context Protocol">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="dot"></div>
      MSSQL·MCP <span>Live Database Gateway</span>
    </div>
    <div class="topbar-sep"></div>
    <div class="topbar-adapter" style="font-size: 13px; font-weight: 500; color: #a1a1aa;">
      <span>Server: </span><strong style="color: #f4f4f5;">hcp.developeradda.com:4431</strong>
      <span style="margin: 0 6px; opacity: 0.4;">|</span>
      <span>DB: </span><strong style="color: #60a5fa;">TG_2024</strong>
    </div>
    <div class="topbar-safety-badge" title="Read-only mode active: All write/mutating queries are blocked">
      <span class="shield-icon">🛡️</span> READ-ONLY LOCK
    </div>
    <div class="topbar-live-status" id="topbarLiveStatus">
      <span class="live-dot" id="liveDot"></span>
      <span class="live-status-text" id="liveStatusText">Live Stream</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-time" id="clock"></div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Real-Time Observability</div>
      <div class="nav-item active" data-page="mssql-monitor">
        <span class="nav-icon">⚡</span>Live Query Monitor
        <span class="nav-badge live-badge" id="sseBadge">LIVE</span>
      </div>
      <div class="nav-item" data-page="table-explorer">
        <span class="nav-icon">🗄️</span>TG_2024 Table Explorer
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Database Operations</div>
      <div class="nav-item" data-page="query-runner">
        <span class="nav-icon">🔍</span>SQL Query Runner
      </div>
    </div>
    <div class="sidebar-section" style="margin-top:auto">
      <div class="sidebar-label">Audit & Governance</div>
      <div class="nav-item" data-page="audit"><span class="nav-icon">📋</span>Audit Trail Log</div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main" id="mainContent">
    <div class="loading"><div class="spinner"></div>Connecting to MSSQL Live Monitor...</div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
